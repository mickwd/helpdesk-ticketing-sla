# Políticas de SLA y calendario hábil.
# Los tiempos se expresan en minutos hábiles salvo que business_hours_only sea false (24x7).

timezone: America/Argentina/Buenos_Aires

business_hours:
  start: "09:00"
  end: "18:00"
  # 0 = lunes ... 6 = domingo
  workdays: [0, 1, 2, 3, 4]

# Fracción del objetivo a partir de la cual se envía la advertencia
warning_threshold: 0.75

policies:
  P1:
    description: Crítico - servicio caído para muchos usuarios
    first_response_minutes: 15
    resolution_minutes: 240
    business_hours_only: false
  P2:
    description: Alto - degradación importante o usuario clave sin servicio
    first_response_minutes: 30
    resolution_minutes: 480
    business_hours_only: true
  P3:
    description: Medio - afecta a un usuario con alternativa disponible
    first_response_minutes: 240
    resolution_minutes: 1620
    business_hours_only: true
  P4:
    description: Bajo - consultas y pedidos estándar
    first_response_minutes: 480
    resolution_minutes: 2700
    business_hours_only: true

# Feriados nacionales de Argentina (incluye días no laborables con fines turísticos).
