[project]
name = "helpdesk-ticketing-sla"
version = "1.0.0"
description = "Sistema de tickets de mesa de ayuda con SLA en horario hábil y escalamiento N1 → N2 → N3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
ml = ["scikit-learn>=1.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "B008",   # Depends() en parámetros por defecto es el patrón de FastAPI
  "RUF001", # caracteres ambiguos: textos en español con tildes y flechas
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/seed_data.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: tests que tardan algunos segundos (seed)"]
filterwarnings = [
  "ignore::DeprecationWarning:apscheduler.*",
  "ignore:Using `httpx` with",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "app/seed_data.py"]
